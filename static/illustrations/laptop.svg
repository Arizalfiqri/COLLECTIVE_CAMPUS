<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#56C596"/>
  <!-- Laptop: lebar ~280px (70% lebar ubin), garis ink 2.5px, layar isi ink -->
  <!-- Bingkai luar layar laptop -->
  <rect x="75" y="140" width="250" height="170" rx="14" fill="#FFFFFF" stroke="#141B34" stroke-width="2.5"/>
  <!-- Detail isi ink: layar display aktif hitam ink -->
  <rect x="90" y="155" width="220" height="135" rx="8" fill="#141B34" stroke="none"/>
  <!-- Webcam titik putih kecil di bezel atas -->
  <circle cx="200" cy="147" r="3" fill="#141B34"/>
  <!-- Basis / Keyboard laptop (trapezoid) -->
  <polygon points="50,335 350,335 325,310 75,310" fill="#FFFFFF" stroke="#141B34" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Lekukan pembuka layar / trackpad -->
  <rect x="175" y="318" width="50" height="12" rx="3" fill="#FFFFFF" stroke="#141B34" stroke-width="2"/>
</svg>