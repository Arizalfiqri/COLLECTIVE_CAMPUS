<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <rect width="400" height="500" fill="#FF8A6B"/>
  <!-- Papan Tulis Portable: lebar ~270px (70% lebar ubin), garis ink 2.5px, penghapus ink -->
  <!-- Kaki penyangga tripod -->
  <line x1="120" y1="320" x2="80" y2="415" stroke="#141B34" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="320" x2="320" y2="415" stroke="#141B34" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="320" x2="200" y2="400" stroke="#141B34" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Palang penyangga horizontal -->
  <line x1="100" y1="380" x2="300" y2="380" stroke="#141B34" stroke-width="2"/>
  <!-- Bingkai luar papan tulis -->
  <rect x="65" y="130" width="270" height="185" rx="10" fill="#FFFFFF" stroke="#141B34" stroke-width="2.5"/>
  <!-- Area tulis papan -->
  <rect x="80" y="145" width="240" height="155" rx="4" fill="#FFFFFF" stroke="#141B34" stroke-width="1.5"/>
  <!-- Baki spidol bawah -->
  <rect x="130" y="315" width="140" height="10" rx="3" fill="#FFFFFF" stroke="#141B34" stroke-width="2"/>
  <!-- Detail isi ink: penghapus papan tulis di baki -->
  <rect x="185" y="307" width="36" height="10" rx="2" fill="#141B34" stroke="none"/>
</svg>
